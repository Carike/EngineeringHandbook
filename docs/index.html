<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Engineering Handbook</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
      <!-- Core Theme -->
      <link
      rel="stylesheet"
      href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css"
    />

    <!-- Theme Add-on(s) -->
    <link
      rel="stylesheet"
      href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/core-dark.min.css"
      media="(prefers-color-scheme: dark)"
      data-group="addon"
      data-sheet="core-dark-auto"
    />
    <link
      rel="stylesheet"
      href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/core-dark.min.css"
      data-group="addon"
      data-sheet="core-dark"
      disabled
    />
    <link
      rel="stylesheet"
      href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/vue.min.css"
      data-group="addon"
      data-sheet="vue"
      disabled
    />
    <!-- Site styles -->
    <style>
      /* Plugin: Carbon Ads */
      #carbonads > :last-child {
        margin-block: calc((1em * var(--line-height)) / 2);
      }

      /* UI Kit */
      .ui-kit-color {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        font-size: var(--font-size-s);
      }

      .ui-kit-color figure {
        flex-grow: 1;
        margin: 0;
        padding: 0;
      }

      .ui-kit-color figure div {
        height: 4rem;
        border-radius: var(--border-radius);
      }

      .ui-kit-color figcaption {
        text-align: center;
        padding: 0.5em 0;
      }
    </style>
    <script>
      // Set html "lang" attribute based on URL
      (function () {
        const lang = location.hash.match(/#\/(de-de|es|ru-ru|zh-cn)\//);

        if (lang) {
          document.documentElement.setAttribute('lang', lang[1]);
        }
      })();
    </script>
</head>
<body>
  <nav>
    <a href="#/">Homepage</a>
    <a href="#/certificatemanagement.md">Jump to a section</a>
  </nav>
  <div id="app">Get building/fixing</div>
  <script>
    window.$docsify = {
      coverpage: true,
      loadNavbar: true,
      loadSidebar: true,
      name: 'Reference',
      repo: '', /*'carike/EngineeringHandbook',*/
      subMaxLevel: 2
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
</body>
</html>
